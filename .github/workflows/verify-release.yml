name: Verify FOSSBilling Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v0.8.9
permissions:
  contents: read
concurrency:
  group: fossbilling-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.fossbilling-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.fossbilling', info['package']
              assert info['name'] == 'FOSSBilling', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'Apache-2.0', info['license']
              assert info['min_os_version'] == '1.5.0', info['min_os_version']

              raw = package.extractfile('manifest.yml').read().decode()
              m = yaml.safe_load(raw)
              app = m['application']
              assert app['subdomain'] == 'fossbilling', app['subdomain']
              # the app has its own admin and client accounts, so it must not sit
              # behind the platform login gate
              assert app.get('public_path') == ['/'], app.get('public_path')
              ups = app['upstreams']
              assert any(u['location'] == '/' and 'fossbilling:80' in (u.get('backend') or '')
                         for u in ups), ups

              svcs = m['services']
              assert set(svcs) == {'fossbilling', 'config-init'}, set(svcs)

              svc = svcs['fossbilling']
              assert 'fossbilling/fossbilling' in svc['image'], svc['image']
              assert svc['image'].endswith(':' + tag.lstrip('v')), svc['image']

              binds = svc['binds']
              # only the writable paths are mounted; all of /var/www/html would
              # shadow the application code baked into the image
              assert any(b.endswith(':/var/www/html/src/config.php') for b in binds), binds
              assert any(b.endswith(':/var/www/html/src/data') for b in binds), binds
              assert any(b.endswith(':/var/www/html/cache') for b in binds), binds
              for b in binds:
                  assert b.startswith('/lzcapp/var'), b
                  assert not b.endswith(':/var/www/html'), 'must not shadow the web root'

              # docker turns a missing bind source into a directory, which would
              # break config.php; the init container creates the file first
              init = svcs['config-init']
              init_cmd = ' '.join(str(x) for x in init['entrypoint'])
              assert 'config.php' in init_cmd, init_cmd
              assert 'rmdir' in init_cmd, 'must clear a stray directory at that path'
              assert ': > /target/config.php' in init_cmd, 'must create the empty file'
              assert svc.get('depends_on') and 'config-init' in svc['depends_on'], svc.get('depends_on')

              env = ' '.join(str(x) for x in svc.get('environment', []))
              # the admin comes from the web installer, never from a baked-in default
              for banned in ('ADMIN_PASSWORD', 'DEFAULT_ADMIN', 'ADMIN_EMAIL'):
                  assert banned not in env, f'unexpected preset credential: {banned}'

              params = yaml.safe_load(package.extractfile('deploy_params.yml').read())
              assert params['params'] == [], params
              refs = set(re.findall(r'\.U\.([A-Za-z0-9_]+)', raw))
              assert refs == set(), ('unexpected deploy param refs', refs)

              assert 'healthcheck' not in svc, svc
              assert 'lzc-file-chooser' not in raw
              assert 'docker.sock' not in raw
              assert 'privileged' not in raw
              assert 'usage' in m and str(m['usage']).strip(), 'usage section missing'
              usage_text = str(m['usage'])
              assert ('真机验证' in usage_text or '实机验证' in usage_text), 'usage must state no device test'
              assert '安装向导' in usage_text, 'usage should describe the installer'

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  main_lic = [n for n in lic if n.endswith('/LICENSE')]
                  target = main_lic[0] if main_lic else lic[0]
                  license_text = content.extractfile(target).read().decode()
                  flat = ' '.join(license_text.split())
                  assert 'Apache License' in flat and 'Version 2.0' in flat, flat[:150]

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
              'note': 'single container with SQLite; installer creates the admin; init container pre-creates config.php',
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
